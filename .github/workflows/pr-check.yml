name: PR Check

on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Quick Checks ──────────────────────────────────────────────────
  quick-check:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check eosim/ --output-format=github
      - name: Unit tests
        run: python -m pytest tests/unit/ -x -q --tb=short
      - name: Platform validation
        # Same check as ci.yml: descriptors live under eosim/platforms, and a
        # tree with none of them is a failure, not "0 platforms, 0 errors".
        run: |
          python -m pytest \
            tests/integration/test_platform_pipeline.py::TestPlatformValidation \
            --no-cov
          count=$(find eosim/platforms -mindepth 2 -maxdepth 2 -name platform.yml -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No platform.yml files found under eosim/platforms"
            exit 1
          fi
          echo "Platform count: $count"

  # ─── Coverage Gate ─────────────────────────────────────────────────
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run with coverage
        run: |
          python -m pytest tests/unit/ \
            --cov=eosim \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -q --tb=short
      - name: Post coverage to PR
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/unit/ --cov=eosim --cov-report=term -q 2>/dev/null | tail -15 >> $GITHUB_STEP_SUMMARY || true

  # ─── Simulator Smoke ───────────────────────────────────────────────
  smoke:
    name: Simulator Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "."
      - name: Smoke test
        run: |
          python -c "
          from eosim.engine.native.simulators import SIMULATOR_MAP, SimulatorFactory

          class FakeVM:
              def __init__(self): self.peripherals = {}
              def add_peripheral(self, n, d): self.peripherals[n] = d

          ok = 0
          for k in SIMULATOR_MAP:
              vm = FakeVM()
              sim = SimulatorFactory.create(k, vm)
              sim.tick()
              ok += 1
          print(f'{ok}/{len(SIMULATOR_MAP)} simulators passed')
          "
