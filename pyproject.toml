[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name, matching embeddedos-ebuild. The import package and
# the `eosim` command keep their names.
name = "embeddedos-eosim"
version = "3.0.2"
description = "Multi-architecture embedded simulation platform for EoS — native engine plus Renode/QEMU backends"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "EoS Project", email = "team@embeddedos.org"},
]
maintainers = [
    {name = "EoS Project", email = "team@embeddedos.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff==0.16.9"]
viz = ["matplotlib>=3.5"]
elf = ["pyelftools>=0.29"]
hil = ["pyserial>=3.5"]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
docs = ["doxypypy>=0.8"]
all = [
    "matplotlib>=3.5",
    "pyelftools>=0.29",
    "pyserial>=3.5",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.9",
]

[project.urls]
Homepage = "https://github.com/embeddedos-org/EoSim"
Repository = "https://github.com/embeddedos-org/EoSim"
Documentation = "https://docs.eosim.io"
"Bug Tracker" = "https://github.com/embeddedos-org/EoSim/issues"
Changelog = "https://github.com/embeddedos-org/EoSim/blob/master/CHANGELOG.md"

[project.scripts]
eosim = "eosim.cli.main:cli"

[tool.setuptools.packages.find]
include = ["eosim*"]

# The platform registry is data, not modules, so packages.find alone does not
# ship it. Without this the wheel installs but `eosim run` cannot find any
# platform - see _resolve_platforms_dir() in eosim/cli/main.py.
[tool.setuptools.package-data]
"eosim.platforms" = ["**/*.yml", "**/*.yaml", "**/*.resc", "**/*.repl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require engines or fixtures)",
    "gui: GUI tests (require display or headless mode)",
    "slow: Tests that take more than a few seconds",
]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["eosim"]
omit = [
    "eosim/gui/*",
    "eosim/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# UP031: printf-style formatting is valid Python and is how the CLI builds its
# fixed-width tables ("%-25s"). Rewriting 110 call sites to f-strings would
# risk output changes for no defect fixed, so the rule stays off.
ignore = ["E501", "UP031"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
# Renderers use physics notation (T transform, L arm length, R radius).
"eosim/gui/renderers/*" = ["N806"]

